<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Where Tokens will Take You</title>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/vendor/topojson-client.min.js"></script>
<style>
  :root {
    --bg: #0e0f10; --surface-1: #1a1a19; --surface-2: #232321; --line: #33332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --grid: #d95926;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; color: inherit; }

  /* ---------- intro / globe ---------- */
  #intro { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #15212f 0%, #0b0d10 55%, #060708 100%);
    transition: opacity .7s ease; z-index: 5; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #globe { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stars circle { fill: #fff; }
  .ocean { fill: #0f2236; }
  .land { fill: #2a4a6a; stroke: #4c76a0; stroke-width: .4; }
  .land.na { fill: #3987e5; }
  .graticule { fill: none; stroke: #ffffff14; stroke-width: .5; }
  .halo { fill: none; stroke: #3987e544; stroke-width: 18; filter: blur(14px); }
  #introCard { position: relative; z-index: 2; text-align: center; margin-top: 56vh;
    transition: opacity .4s ease, transform .4s ease; }
  #introCard.hide { opacity: 0; transform: translateY(12px); }
  h1 { margin: 0 auto 34px; font-size: clamp(40px, 6.2vw, 84px); letter-spacing: -.045em; font-weight: 750; line-height: 1;
    max-width: 14ch; text-wrap: balance;
    background: linear-gradient(180deg, #ffffff 30%, #9ec5f4 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .introErr { color: var(--critical); margin: -18px 0 24px; font-size: 15px; }
  .pick { display: inline-flex; gap: 8px; background: #ffffff0d; padding: 6px; border-radius: 999px;
    border: 1px solid #ffffff1f; backdrop-filter: blur(12px); box-shadow: 0 10px 40px #0008; }
  .pick select { background: transparent; border: 0; border-radius: 999px; padding: 10px 18px; min-width: 190px; font-size: 15px; }
  .pick .btn { border-radius: 999px; padding: 10px 24px; font-size: 15px; }
  .faces .ring { fill: none; stroke: #ffffffd9; stroke-width: 2.5; }
  .faces .bg { fill: #1c3552; }
  .faces .pin { fill: #ffffffd9; }
  .faces text { fill: #f0efec; font-size: 15px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #060708; stroke-width: 4px; stroke-linejoin: round; }
  .faces g { transition: opacity .3s ease; }
  .btn { background: var(--accent); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }

  /* ---------- app ---------- */
  #app { position: fixed; inset: 0; display: grid; grid-template-columns: 300px 1fr; opacity: 0;
    transition: opacity .8s ease; }
  #app.on { opacity: 1; }
  aside { background: var(--surface-1); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 28px; }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .brand b { font-size: 17px; letter-spacing: -.01em; font-weight: 600; }
  .icon { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 8px; color: var(--text-secondary); }
  .sec { margin-top: 26px; }
  .sec h3 { margin: 0 0 10px; font-size: 13px; color: var(--text-muted); font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; }
  .reset { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
  .reset[hidden] { display: none; }
  .v.changed { color: var(--accent); }
  .warn { color: var(--warning); }
  .est { font-size: 10px; letter-spacing: .03em; color: var(--text-muted); border: 1px solid var(--line); border-radius: 4px;
    padding: 0 4px; margin-left: 6px; vertical-align: 1px; font-weight: 500; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #topList, #detail > *, .crumb { transition: opacity .2s ease; }
  body.busy #topList, body.busy #detail > *:not(.close) { opacity: .45; }
  .seg { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { background: transparent; border: 0; padding: 7px 0; border-radius: 8px; cursor: pointer; color: var(--text-secondary); font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--text-primary); color: #111; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; color: var(--text-secondary); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .v { width: 44px; text-align: right; color: var(--text-primary); }
  select.full { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .legend .bar { height: 10px; border-radius: 5px; }
  .legend .ticks { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  ol.top { list-style: none; padding: 0; margin: 0; counter-reset: t; }
  ol.top li { counter-increment: t; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline;
    padding: 7px 6px; border-radius: 8px; cursor: pointer; }
  ol.top li:hover { background: var(--surface-2); }
  ol.top li::before { content: counter(t); color: var(--text-muted); font-size: 12px; }
  ol.top .s { color: var(--text-muted); font-size: 12px; }

  main { position: relative; overflow: hidden; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; }
  #map:active { cursor: grabbing; }
  .county { stroke: var(--bg); stroke-width: .25; }
  .county.dim { fill: #262624 !important; }
  .county:hover { stroke: var(--text-primary); stroke-width: 1; }
  .county.sel { stroke: #fff; stroke-width: 1.6; }
  .stfill { stroke: var(--bg); stroke-width: .8; cursor: pointer; }
  .stfill:hover { stroke: var(--text-primary); stroke-width: 1.5; }
  .stfill.dim { fill: #262624 !important; }
  .stfill.ctx { fill: #1d1d1c !important; }
  .stfill.ctx:hover { fill: #2a2a28 !important; }
  .stfill.cur { fill: none !important; pointer-events: none; }
  .pins g { cursor: pointer; }
  .pins circle { fill: var(--text-primary); stroke: #0e0f10; stroke-width: 1.5; filter: drop-shadow(0 2px 4px #000a); }
  .pins g:hover circle, .pins g.on circle { fill: var(--warning); }
  ol.top li > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .states { fill: none; stroke: #0e0f10; stroke-width: 1; stroke-linejoin: round; }
  .gridline { fill: none; stroke: var(--grid); stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .topbar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .crumb { background: #000a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--text-muted); backdrop-filter: blur(8px); }
  .crumb b { color: var(--text-primary); }
  .zoombtns { display: flex; flex-direction: column; gap: 6px; position: absolute; bottom: 18px; left: 16px; }
  .zoombtns button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-1); cursor: pointer; font-size: 16px; color: var(--text-secondary); }
  #tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; min-width: 180px; display: none; box-shadow: 0 8px 24px #0008; }
  #tip .t { font-weight: 600; margin-bottom: 4px; }
  #tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--text-secondary); }
  #tip .r b { color: var(--text-primary); font-weight: 600; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-muted); pointer-events: none; }

  /* ---------- detail ---------- */
  #detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(470px, 100%); background: var(--surface-1);
    border-left: 1px solid var(--line); transform: translateX(105%); transition: transform .35s ease; overflow-y: auto; padding: 20px 22px 40px; z-index: 3; }
  #detail.open { transform: none; box-shadow: -20px 0 40px #0007; }
  .close { position: sticky; top: 0; float: right; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; }
  #detail h2 { margin: 2px 0 0; font-size: 26px; letter-spacing: -.025em; font-weight: 700; }
  .sub { color: var(--text-muted); }
  .hero { margin: 28px 0 22px; }
  .hero .big { font-size: 56px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
  .hero .line { color: var(--text-secondary); margin-top: 8px; font-size: 15px; }
  .factors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .factor { background: var(--surface-2); border-radius: 12px; padding: 12px; border: 1px solid transparent; }
  .factor.bind { border-color: var(--warning); }
  .factor .k { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; }
  .factor.bind .k b { color: var(--warning); font-weight: 500; font-size: 11px; }
  .factor .m { font-size: 20px; font-weight: 600; margin-top: 4px; letter-spacing: -.01em; }
  .factor .s { color: var(--text-secondary); font-size: 12px; }
  .factor .flag { color: var(--warning); font-size: 11px; margin-top: 4px; }
  .meter { height: 6px; background: #ffffff14; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .card { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
  .card h4 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
  details.card summary { cursor: pointer; list-style: none; font-size: 13px; color: var(--text-muted); }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "+"; float: right; }
  details.card[open] summary::after { content: "−"; }
  details.card[open] summary { margin-bottom: 8px; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--text-secondary); vertical-align: top; }
  table.kv td:last-child { text-align: right; color: var(--text-primary); }
  table.kv tr:last-child td { border-bottom: 0; }
  .bars .b { display: grid; grid-template-columns: 130px 1fr 70px; gap: 8px; align-items: center; margin: 6px 0; color: var(--text-secondary); font-size: 13px; }
  .bars .b .track { height: 10px; background: #ffffff10; border-radius: 0 4px 4px 0; }
  .bars .b .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  .bars .b.cur .fill { background: #9ec5f4; }
  .bars .b span:last-child { text-align: right; color: var(--text-primary); }
  .note { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin-top: 16px; text-align: center; }
  .alert { display: flex; gap: 10px; background: #fab21914; border: 1px solid #fab21966; border-radius: 12px;
    padding: 11px 14px; margin: -6px 0 18px; font-size: 14px; line-height: 1.45; }
  .why { color: var(--text-muted); font-size: 12px; margin: 10px 2px 0; }
  .cost-big { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
  .stack { display: flex; gap: 2px; height: 8px; margin: 14px 0 8px; }
  .stack i { display: block; flex: 1 1 0; min-width: 4px; border-radius: 4px; }
  .stack-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .stack-key .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .c-power { background: #d95926; } .c-water { background: #3987e5; } .c-land { background: #199e70; }
  #layerSeg button { font-size: 12.5px; }
  .factor .s { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
  ul.next { margin: 0; padding-left: 18px; color: var(--text-primary); line-height: 1.55; }
  ul.next li + li { margin-top: 4px; }
  /* sites for sale: one box per listing */
  .lsts { display: grid; gap: 12px; margin-top: 10px; }
  .lst { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
  .lst .media { position: relative; aspect-ratio: 5 / 2; max-width: 100%; background: #10161d; overflow: hidden; }
  .lst .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lst .media svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plat .grid { stroke: #ffffff0d; stroke-width: 1; }
  .plat .need { fill: none; stroke: #9ec5f4aa; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .plat .lot { fill: #3987e540; stroke: var(--accent); stroke-width: 1.5; }
  .plat .lot.full { fill: #0ca30c40; stroke: var(--good); }
  .plat text { fill: var(--text-secondary); font-size: 12px; font-family: inherit; }
  .plat text.big { fill: var(--text-primary); font-size: 15px; font-weight: 650; }
  .lst .tags { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .lst .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #0e0f10cc; color: var(--text-primary);
    backdrop-filter: blur(6px); display: inline-flex; align-items: center; gap: 5px; }
  .lst .tag .d { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .lst .tag.unclear .d { background: var(--warning); }
  .lst .tag.r { margin-left: auto; font-weight: 500; color: var(--text-secondary); }
  .lst .body { padding: 12px 14px 14px; display: grid; gap: 10px; }
  .lst .t { font-size: 15px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; text-wrap: balance; }
  .lst .loc { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
  .lst .price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .lst .price b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .lst .price span { color: var(--text-muted); font-size: 12px; }
  .lst .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 8px; overflow: hidden; }
  .lst .facts div { background: var(--surface-2); padding: 8px 10px; min-width: 0; }
  .lst .facts small { display: block; color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
  .lst .facts b { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .lst .facts i { display: block; font-style: normal; color: var(--text-muted); font-size: 11px; margin-top: 1px; }
  .lst .facts .na b { color: var(--text-muted); font-weight: 500; }
  .lst .fitbar { height: 6px; background: #ffffff10; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .lst .fitbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .lst .fitbar i.full { background: var(--good); }
  .lst .fit { font-size: 12.5px; color: var(--text-secondary); }
  .lst .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }
  .lst .chips li { font-size: 11.5px; color: var(--text-secondary); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 7px; line-height: 1.35; }
  .lst ul.hl { margin: 0; padding-left: 16px; color: var(--text-secondary); font-size: 12.5px; line-height: 1.5; }
  .lst .chk { font-size: 12px; color: var(--text-secondary); line-height: 1.45; background: #fab21910; border-left: 2px solid var(--warning);
    padding: 6px 9px; border-radius: 0 6px 6px 0; }
  .lst .chk b { color: var(--warning); font-weight: 600; }
  .lst .by { color: var(--text-muted); font-size: 11.5px; line-height: 1.45; }
  .lst a.go { display: flex; justify-content: center; gap: 6px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
    border-radius: 9px; padding: 9px 12px; font-size: 13.5px; }
  .lst a.go:hover { filter: brightness(1.1); }
  .lst a.go span { opacity: .75; font-weight: 500; }
  .sites-note { color: var(--text-secondary); font-size: 12.5px; line-height: 1.45; margin-top: 6px; }
  .searching { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .searching { animation: none; } }
  ul.src { margin: 0; padding: 0; list-style: none; color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
  ul.src li + li { margin-top: 6px; }
  ul.src b { color: var(--text-primary); font-weight: 500; }
  .lnk-i { color: var(--accent); text-decoration: none; }
  dl.method { margin: 0; font-size: 13px; }
  dl.method dt { color: var(--text-muted); font-size: 12px; margin-top: 10px; }
  dl.method dt:first-child { margin-top: 0; }
  dl.method dd { margin: 2px 0 0; color: var(--text-secondary); line-height: 1.45; }
  .rng { color: var(--text-muted); font-size: 12px; margin-top: 1px; }
  .lnk { display: inline-block; margin-top: 12px; color: var(--accent); text-decoration: none; font-size: 13px; }
  .err { color: var(--critical); }
  .crumb .err a, .crumb a.retry { color: var(--accent); }
</style>
</head>
<body>

<!-- =============== INTRO: spinning globe =============== -->
<section id="intro">
  <svg id="globe" aria-label="Spinning globe"></svg>
  <div id="introCard">
    <h1>Where Tokens will Take You</h1>
    <p class="introErr" id="introErr" hidden></p>
    <div class="pick">
      <select id="regionSel" aria-label="Region"></select>
      <button class="btn" id="goBtn">Explore</button>
    </div>
  </div>
</section>

<!-- =============== APP =============== -->
<div id="app">
  <aside>
    <div class="brand">
      <b>Where Tokens will Take You</b>
      <button class="btn ghost icon" id="backBtn" title="Back to globe" aria-label="Back to globe">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="2.8" ry="6.5"/><path d="M1.5 8h13"/></svg>
      </button>
    </div>

    <div class="sec">
      <h3>Map</h3>
      <div class="seg" id="layerSeg" style="--n:5">
        <button data-k="score" aria-pressed="true">Overall</button>
        <button data-k="power_score">Power</button>
        <button data-k="water_score">Water</button>
        <button data-k="land_score">Land</button>
        <button data-k="cost_score">Cost</button>
      </div>
      <div class="legend" style="margin-top:12px">
        <div class="bar" id="legendBar"></div>
        <div class="ticks" id="legendTicks"><span>Low</span><span>High</span></div>
      </div>
    </div>

    <div class="sec">
      <h3>Priorities <button class="reset" id="resetW" hidden>Reset</button></h3>
      <div class="row">Power<input type="range" id="wp" min="0" max="100" /><span class="v num" id="wpV"></span></div>
      <div class="row">Water<input type="range" id="ww" min="0" max="100" /><span class="v num" id="wwV"></span></div>
      <div class="row">Land<input type="range" id="wl" min="0" max="100" /><span class="v num" id="wlV"></span></div>
    </div>

    <div class="sec">
      <h3>Minimum size <button class="reset" id="resetMin" hidden>Reset</button></h3>
      <div class="row"><input type="range" id="minMw" min="0" max="1000" step="25" value="0" /><span class="v num" id="minMwV">Any</span></div>
    </div>

    <div class="sec">
      <h3>Cooling <button class="reset" id="resetC" hidden>Reset</button></h3>
      <div class="seg" id="coolSeg" style="--n:3"></div>
    </div>

    <div class="sec">
      <h3>Power price <button class="reset" id="resetP" hidden>Reset</button></h3>
      <div class="seg" id="powerSeg" style="--n:3"></div>
    </div>

    <div class="sec">
      <h3>Grid lines</h3>
      <div class="seg" id="kvSeg" style="--n:3">
        <button data-kv="500" aria-pressed="true">500 kV</button>
        <button data-kv="345" aria-pressed="true">345 kV</button>
        <button data-kv="230" aria-pressed="false">230 kV</button>
      </div>
    </div>

    <div class="sec">
      <h3 id="topTitle">Top states</h3>
      <ol class="top" id="topList" aria-live="polite"></ol>
    </div>
  </aside>

  <main>
    <svg id="map" aria-label="County heat map"></svg>
    <div class="loading" id="loading">Loading…</div>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
    </div>
    <div class="zoombtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view">⟲</button></div>
    <div id="tip"></div>
    <section id="detail" aria-live="polite"></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = d3.format(",.0f");
const fmtMW = v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + " GW" : fmt(v) + " MW";
const fmtMoney = v => v >= 1e9 ? "$" + (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : "$" + fmt(v);
const fmtTok = v => v >= 1e15 ? (v / 1e15).toFixed(1) + " quadrillion" : v >= 1e12 ? (v / 1e12).toFixed(1) + " trillion" : (v / 1e9).toFixed(1) + " billion";
const LAYER_NAME = { score: "Overall", power_score: "Power", water_score: "Water", land_score: "Land", cost_score: "Cost" };
const COOL_NAME = { evaporative: "Evaporative", hybrid: "Hybrid", closed_loop: "Dry" };
const SRC_NAME = { transmission: "Power lines", generation: "Generation", water: "Water use", climate: "Climate", population: "Population",
  land: "Land area", price: "Electricity price", tokens: "Tokens", capacity: "Capacity, PJM", capacity_miso: "Capacity, MISO",
  capacity_isne: "Capacity, ISO-NE", capacity_nyiso: "Capacity, NYISO", ppa: "PPA price", land_price: "Land price",
  land_premium: "Land premium" };
// A county under this size can't host a large campus, whatever its score. Shown as a warning, never hidden by the score.
let MIN_VIABLE = 100;   // replaced by facility.min_viable_mw from /api/config
function blockers(r) {
  const b = [];
  if (r.supportable_mw < MIN_VIABLE) b.push(`Under ${MIN_VIABLE} MW. Too small for a large campus.`);
  if (!r.max_kv) b.push("No 230 kV+ line. A new line takes 5–8 years.");
  return b;
}
const warnMW = r => r.supportable_mw < MIN_VIABLE || !r.max_kv
  ? `<span class="warn" title="${blockers(r).join(" ")}">⚠ ${fmtMW(r.supportable_mw)}</span>` : fmtMW(r.supportable_mw);
const coolName = k => COOL_NAME[k] || CFG.cooling[k].label.split(" (")[0];
// sequential blue ramp, dark surface: low recedes toward the surface, high is light
const RAMP = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#6da7ec", "#86b6ef", "#9ec5f4", "#b7d3f6", "#cde2fb"];
const color = d3.scaleQuantize([0, 100], RAMP);
$("#legendBar").style.background = `linear-gradient(90deg, ${RAMP.join(",")})`;

const state = { layer: "score", minMw: 0, cooling: null, power: null, w: {}, rows: new Map(), sel: null,
  view: "country", st: null, stAgg: new Map() };   // view: "country" (states) -> "state" (its counties)
const ABBR = new Map();  // state FIPS -> postal code, filled from the county rows
let CFG;

/* =============================== GLOBE =============================== */
const gsvg = d3.select("#globe");
let gW, gH, gR, proj, gpath, spin, rot = [20, -15, 0], facesOn = true;
// the team, pinned to home: [lon, lat]
const TEAM = [
  { id: "hovik", name: "Hovik", country: "Armenia", at: [44.5, 40.2] },
  { id: "joy", name: "Joy", country: "China", at: [104.2, 35.9] },
  { id: "dome", name: "Dome", country: "Thailand", at: [100.9, 15.1] },
  { id: "mj", name: "MJ", country: "Trinidad and Tobago", at: [-61.3, 10.5] },
];
async function initGlobe() {
  const [land, countries] = await Promise.all([d3.json("/static/vendor/land-110m.json"), d3.json("/static/vendor/countries-110m.json")]);
  const landF = topojson.feature(land, land.objects.land);
  const ctry = topojson.feature(countries, countries.objects.countries).features;
  const NA = new Set(["840"]);  // the US: the region the tool scores
  gW = 1600; gH = 900; gR = 250;  // fixed canvas, scaled to the window with preserveAspectRatio=slice
  proj = d3.geoOrthographic().scale(gR).translate([gW / 2, gH * 0.36]).rotate(rot).clipAngle(90);
  gpath = d3.geoPath(proj);
  gsvg.attr("viewBox", `0 0 ${gW} ${gH}`).attr("preserveAspectRatio", "xMidYMid slice");
  const stars = gsvg.append("g").attr("class", "stars");
  d3.range(160).forEach(() => stars.append("circle").attr("cx", Math.random() * gW).attr("cy", Math.random() * gH)
    .attr("r", Math.random() * 1.1 + .2).attr("opacity", Math.random() * .6 + .1));
  const g = gsvg.append("g");
  g.append("circle").attr("class", "halo");
  g.append("path").datum({ type: "Sphere" }).attr("class", "ocean");
  g.append("path").datum(d3.geoGraticule10()).attr("class", "graticule");
  g.append("path").datum(landF).attr("class", "land");
  g.selectAll(".ctry").data(ctry.filter(c => NA.has(c.id))).join("path").attr("class", "land na ctry").attr("opacity", 0);
  const fg = gsvg.append("g").attr("class", "faces");
  const face = fg.selectAll("g").data(TEAM).join("g");
  face.append("clipPath").attr("id", d => "clip-" + d.id).append("circle").attr("r", 27);
  face.append("path").attr("class", "pin").attr("d", "M-7,24 L0,40 L7,24 Z");
  face.append("circle").attr("class", "bg").attr("r", 27);
  face.append("image").attr("href", d => `/static/team/${d.id}.png`).attr("x", -27).attr("y", -27).attr("width", 54).attr("height", 54)
    .attr("clip-path", d => `url(#clip-${d.id})`);
  face.append("circle").attr("class", "ring").attr("r", 27);
  face.append("text").attr("y", -36).text(d => d.name);
  face.append("title").text(d => `${d.name} · ${d.country}`);
  const draw = () => {
    g.select(".halo").attr("cx", proj.translate()[0]).attr("cy", proj.translate()[1]).attr("r", proj.scale());
    g.selectAll("path").attr("d", gpath);
    const c = proj.invert(proj.translate());
    face.attr("transform", d => { const [x, y] = proj(d.at); return `translate(${x},${y - 40})`; })
      .attr("opacity", d => facesOn && d3.geoDistance(d.at, c) < 1.35 ? 1 : 0);
  };
  draw();
  spin = d3.timer(el => { rot[0] = 20 + el * 0.012; proj.rotate(rot); draw(); });
  window.globeDraw = draw;
  window.globeG = g;
}

let zooming = false;
function zoomToRegion() {
  if (zooming) return;   // ignore a double click while the globe is flying
  zooming = true;
  spin && spin.stop();
  facesOn = false;
  $("#introCard").classList.add("hide");
  const from = proj.rotate(), to = [98, -40, 0];
  const s0 = proj.scale(), s1 = gR * 3.4;
  const t0 = proj.translate(), t1 = [gW / 2, gH / 2];
  const ri = d3.interpolate(from, to), si = d3.interpolate(s0, s1), ti = d3.interpolate(t0, t1);
  globeG.selectAll(".ctry").transition().duration(900).attr("opacity", 1);
  d3.transition().duration(2200).ease(d3.easeCubicInOut).tween("zoom", () => t => {
    proj.rotate(ri(Math.min(1, t * 1.6))).scale(si(t)).translate(ti(t)); globeDraw();
  }).on("end", () => {
    $("#app").classList.add("on");
    $("#intro").classList.add("gone");
    zooming = false;
    mapIntro();
  });
}

function backToGlobe() {
  $("#intro").classList.remove("gone");
  $("#app").classList.remove("on");
  $("#introCard").classList.remove("hide");
  globeG.selectAll(".ctry").attr("opacity", 0);
  facesOn = true;
  proj.scale(gR).translate([gW / 2, gH * 0.36]);
  rot = [20, -15, 0];
  spin = d3.timer(el => { rot[0] = 20 + el * 0.012; proj.rotate(rot); globeDraw(); });
}

/* =============================== MAP =============================== */
const W = 975, H = 610;
const msvg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
const zoomG = msvg.append("g");
const countyG = zoomG.append("g"), stFillG = zoomG.append("g"), stateG = zoomG.append("g"), gridG = zoomG.append("g"),
  pinG = zoomG.append("g").attr("class", "pins");
const CENTROID = new Map();  // county GEOID -> [x, y] on the map
let pinK = 1;
const pinXf = d => `translate(${d.xy[0]},${d.xy[1]}) scale(${1 / pinK})`;  // same size on screen at any zoom
const mproj = d3.geoAlbersUsa();
const mpath = d3.geoPath(mproj);
const zoom = d3.zoom().scaleExtent([1, 24]).translateExtent([[-W * 0.6, -H * 0.6], [W * 1.6, H * 1.6]])
  .on("zoom", e => {
    zoomG.attr("transform", e.transform);
    countyG.selectAll("path").attr("stroke-width", .25 / e.transform.k);
    stateG.select("path").attr("stroke-width", 1 / e.transform.k);
    stFillG.selectAll("path").attr("stroke-width", .8 / e.transform.k);
    gridG.selectAll("path").attr("stroke-width", d => kvWidth(d.properties.kv) / Math.sqrt(e.transform.k));
    pinK = e.transform.k; pinG.selectAll("g").attr("transform", pinXf);
  });
msvg.call(zoom);
const kvWidth = kv => kv >= 500 ? 1.6 : kv >= 345 ? 1.0 : .5;
let mapReady;

async function initMap() {
  const [counties, us, grid] = await Promise.all([
    d3.json("/static/data/counties.geojson"), d3.json("/static/vendor/counties-10m.json"), d3.json("/static/data/grid.json")]);
  mproj.fitExtent([[10, 40], [W - 10, H - 10]], { type: "FeatureCollection", features: counties.features.filter(f => f.properties.GEOID.slice(0, 2) !== "02" && f.properties.GEOID.slice(0, 2) !== "15") });
  // albersUsa insets AK/HI; fit on CONUS then re-fit including insets
  mproj.fitExtent([[10, 50], [W - 10, H - 10]], counties);
  for (const f of counties.features) CENTROID.set(f.properties.GEOID, mpath.centroid(f));
  countyG.selectAll("path").data(counties.features).join("path")
    .attr("class", "county").attr("d", mpath)
    .attr("fill", "#262624")
    .on("mousemove", showTip).on("mouseleave", () => $("#tip").style.display = "none")
    .on("click", (e, d) => openCounty(d.properties.GEOID));
  stFillG.selectAll("path").data(topojson.feature(us, us.objects.states).features).join("path")
    .attr("class", "stfill").attr("d", mpath).attr("fill", "#262624")
    .on("mousemove", showStateTip).on("mouseleave", () => $("#tip").style.display = "none")
    .on("click", (e, d) => enterState(d.id));
  stateG.append("path").datum(topojson.mesh(us, us.objects.states, (a, b) => a !== b)).attr("class", "states").attr("d", mpath);
  countyG.attr("display", "none");
  STATE_NAMES = new Map(topojson.feature(us, us.objects.states).features.map(f => [f.id, f.properties.name]));
  gridG.selectAll("path").data(grid.features).join("path").attr("class", "gridline").attr("d", mpath)
    .attr("stroke-width", d => kvWidth(d.properties.kv)).attr("stroke-opacity", d => d.properties.kv >= 345 ? .9 : .55);
  applyKv();
  $("#loading").remove();
}

function mapIntro() {
  // land on the map with a short zoom-out, continuing the globe's motion
  msvg.call(zoom.transform, d3.zoomIdentity.translate(-W * .35, -H * .4).scale(1.7));
  msvg.transition().delay(150).duration(1300).ease(d3.easeCubicOut).call(zoom.transform, d3.zoomIdentity);
}

function applyKv() {
  const on = new Set([...document.querySelectorAll("#kvSeg button[aria-pressed=true]")].map(b => +b.dataset.kv));
  gridG.selectAll("path").attr("display", d => on.has(d.properties.kv) ? null : "none");
}

// State value = mean score of its best quarter of counties (where you'd actually build),
// then ranked 0-100 among the states so the country view has full contrast.
function aggregateStates() {
  const by = d3.group([...state.rows.values()], r => r.GEOID.slice(0, 2));
  const raw = [];
  for (const [fips, rs] of by) {
    ABBR.set(fips, rs[0].STUSPS);
    // missing values are left out, never counted as zero
    const ranked = rs.filter(r => r[state.layer] != null).sort((a, b) => b[state.layer] - a[state.layer]);
    const q = ranked.slice(0, Math.max(1, Math.ceil(ranked.length / 4)));
    const best = rs.reduce((a, b) => (b.score > a.score ? b : a));
    raw.push({ fips, v: q.length ? d3.mean(q, r => r[state.layer]) : null, costMwh: d3.mean(q, r => r.cost_mwh),
      n: rs.length, best, nOk: rs.filter(r => r.supportable_mw >= state.minMw).length });
  }
  // rank among states (0 = weakest, 100 = strongest) so colors spread evenly
  const order = raw.filter(d => d.v != null).map(d => d.v).sort((a, b) => a - b);
  const rank = v => v == null ? null : (d3.bisectLeft(order, v) / Math.max(1, order.length - 1)) * 100;
  state.stAgg = new Map(raw.map(d => [d.fips, { ...d, rank: rank(d.v) }]));
}

function paint() {
  aggregateStates();
  saveHash();
  $("#legendTicks").innerHTML = state.layer === "cost_score" ? "<span>Higher cost</span><span>Lower cost</span>" : "<span>Low</span><span>High</span>";
  const country = state.view === "country";
  stFillG.selectAll("path")
    .attr("fill", d => { const a = state.stAgg.get(d.id); return a && a.rank != null ? color(a.rank) : "#262624"; })
    .classed("dim", d => { const a = state.stAgg.get(d.id); return country && (!a || a.nOk === 0); })
    .classed("ctx", d => !country && d.id !== state.st)
    .classed("cur", d => !country && d.id === state.st);
  if (country) return;
  countyG.selectAll("path")
    .attr("fill", d => { const r = state.rows.get(d.properties.GEOID); return r && r[state.layer] != null ? color(r[state.layer]) : "#262624"; })
    .classed("dim", d => { const r = state.rows.get(d.properties.GEOID); return !r || r.supportable_mw < state.minMw; })
    .classed("sel", d => d.properties.GEOID === state.sel);
}

function q() {
  const p = new URLSearchParams({ cooling: state.cooling, power: state.power, wp: state.w.power, ww: state.w.water, wl: state.w.land });
  return p.toString();
}

let reloadT, reloadSeq = 0, deepLink = null;
const getJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
async function reload() {
  clearTimeout(reloadT);
  document.body.classList.add("busy"); renderCrumb();
  reloadT = setTimeout(async () => {
    const seq = ++reloadSeq;
    try {
      const rows = await getJSON("/api/map?" + q());
      if (seq !== reloadSeq) return;
      state.rows = new Map(rows.map(r => [r.GEOID, r]));
      await mapReady;
      if (deepLink) { const d = deepLink; deepLink = null; enterApp(); paint();
        if (d.st && state.stAgg.has(d.st)) d.co && state.rows.has(d.co) ? openCounty(d.co, true) : enterState(d.st); }
      paint();
      await renderTop();
      if (state.sel && $("#detail").classList.contains("open")) await openCounty(state.sel);
      if (seq === reloadSeq) { document.body.classList.remove("busy"); state.err = null; renderCrumb(); }
    } catch (e) {
      if (seq !== reloadSeq) return;
      document.body.classList.remove("busy"); state.err = "Couldn’t update."; renderCrumb();
    }
  }, 120);
}

// Best opportunities: counties a large campus can actually use (big enough, a 230 kV+ line),
// ranked by the map's layer. Counties that fail a hard limit never make the list, whatever their score.
function bestCounties() {
  const k = state.layer;
  return [...state.rows.values()]
    .filter(r => r[k] != null && r.supportable_mw >= Math.max(state.minMw, MIN_VIABLE) && r.max_kv)
    .sort((a, b) => b[k] - a[k]).slice(0, 10);
}
function drawPins(list) {
  const items = list.map((r, i) => ({ r, i, xy: CENTROID.get(r.GEOID) })).filter(d => d.xy && !isNaN(d.xy[0]));
  const g = pinG.selectAll("g").data(items, d => d.r.GEOID).join(enter => {
    const e = enter.append("g");
    e.append("circle").attr("r", 5);
    return e;
  });
  g.attr("transform", pinXf).classed("on", d => d.r.GEOID === state.sel)
    .on("click", (e, d) => { e.stopPropagation(); openCounty(d.r.GEOID, true); })
    .on("mousemove", (e, d) => showTip(e, { properties: { GEOID: d.r.GEOID } }))
    .on("mouseleave", () => $("#tip").style.display = "none");
}

async function renderTop() {
  if (state.view === "country") {
    const cost = state.layer === "cost_score";
    $("#topTitle").textContent = cost ? "Lowest cost" : "Best opportunities";
    const top = bestCounties();
    $("#topList").innerHTML = top.length
      ? top.map(t => `<li data-g="${t.GEOID}" tabindex="0" role="button"><span>${t.NAME}, ${t.STUSPS}</span><span class="s num">${fmtMW(t.supportable_mw)}</span><b class="num">${cost ? "$" + t.cost_mwh.toFixed(0) : t[state.layer].toFixed(0)}</b></li>`).join("")
      : `<li style="cursor:default"><span></span><span class="s">None at ${fmtMW(state.minMw)}</span></li>`;
    document.querySelectorAll("#topList li[data-g]").forEach(li => li.onclick = () => openCounty(li.dataset.g, true));
    drawPins(top);
  } else {
    const fips = state.st;
    $("#topTitle").textContent = `Top in ${stateName(fips)}`;
    const top = await getJSON(`/api/top?n=10&min_mw=${state.minMw}&state=${ABBR.get(fips)}&` + q());
    if (state.st !== fips) return;
    $("#topList").innerHTML = top.length
      ? top.map(t => `<li data-g="${t.GEOID}" tabindex="0" role="button"><span>${t.NAME}</span><span class="s num">${warnMW(t)}</span><b class="num">${t.score.toFixed(0)}</b></li>`).join("")
      : `<li style="cursor:default"><span></span><span class="s">None at ${fmtMW(state.minMw)}</span></li>`;
    document.querySelectorAll("#topList li[data-g]").forEach(li => li.onclick = () => openCounty(li.dataset.g, true));
    drawPins(top);
  }
}

let STATE_NAMES = new Map();
const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
const stateName = f => STATE_NAMES.get(f) || ABBR.get(f) || f;

function renderCrumb() {
  $("#crumb").innerHTML = state.view === "country"
    ? `<b>United States</b>`
    : `<a id="cUS" href="#" role="button">United States</a> › <b>${stateName(state.st)}</b>`;
  if (state.err) $("#crumb").innerHTML += ` · <span class="err">${state.err}</span> <a class="retry" id="cRetry" href="#">Retry</a>`;
  else if (document.body.classList.contains("busy") && state.rows.size) $("#crumb").innerHTML += ` · Updating…`;
  if ($("#cUS")) $("#cUS").onclick = e => { e.preventDefault(); toCountry(); };
  if ($("#cRetry")) $("#cRetry").onclick = e => { e.preventDefault(); reload(); };
}

function fitTo(feature, pad = 0.85, dur = 900) {
  const [[x0, y0], [x1, y1]] = mpath.bounds(feature);
  const k = Math.min(12, pad / Math.max((x1 - x0) / W, (y1 - y0) / H));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  msvg.transition().duration(dur).ease(d3.easeCubicInOut)
    .call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * cx, H / 2 - k * cy).scale(k));
}

function enterState(fips) {
  if (!state.stAgg.has(fips)) return;
  $("#tip").style.display = "none";
  if (state.sel) closeDetail();
  state.view = "state"; state.st = fips;
  countyG.attr("display", null);
  countyG.selectAll("path").attr("display", d => d.properties.GEOID.slice(0, 2) === fips ? null : "none");
  paint(); renderCrumb(); renderTop();
  fitTo(stFillG.selectAll("path").filter(d => d.id === fips).datum());
}

function toCountry() {
  $("#tip").style.display = "none";
  if (state.sel) closeDetail();
  state.view = "country"; state.st = null;
  countyG.attr("display", "none");
  paint(); renderCrumb(); renderTop();
  msvg.transition().duration(800).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity);
}

function showStateTip(e, d) {
  if (state.view === "state" && d.id === state.st) return;
  const a = state.stAgg.get(d.id); if (!a) return;
  placeTip(e, `<div class="t">${stateName(d.id)}</div>
    <div class="r">${state.layer === "cost_score" ? "Cost, cheapest quarter" : LAYER_NAME[state.layer]}<b class="num">${a.v == null ? "No data" : state.layer === "cost_score" ? "$" + a.costMwh.toFixed(0) + "/MWh" : a.v.toFixed(0)}</b></div>
    <div class="r">Best<b>${a.best.NAME} · ${warnMW(a.best)}</b></div>`);
}

function placeTip(e, html) {
  const tip = $("#tip"), box = $("main").getBoundingClientRect();
  tip.innerHTML = html;
  tip.style.display = "block";
  let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
  if (x + 260 > box.width) x -= 280;
  if (y + 170 > box.height) y -= 180;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

function showTip(e, d) {
  const r = state.rows.get(d.properties.GEOID);
  if (!r) return placeTip(e, `<div class="t">${d.properties.NAME || "County"}</div><div class="r">No data</div>`);
  const blk = blockers(r);
  placeTip(e, `<div class="t">${r.NAME}, ${r.STUSPS}</div>
    ${state.layer !== "cost_score" ? `<div class="r">${LAYER_NAME[state.layer]}<b class="num">${r[state.layer].toFixed(0)}</b></div>` : ""}
    <div class="r">Capacity<b class="num">${fmtMW(r.supportable_mw)}</b></div>
    <div class="r">Cost<b class="num">${r.cost_mwh != null ? "$" + r.cost_mwh.toFixed(0) + "/MWh" : "No data"}</b></div>
    <div class="r">Limit<b>${cap(r.binding)}</b></div>
    ${blk.length ? `<div class="r warn" style="margin-top:4px">⚠ ${blk[0]}</div>` : ""}`);
}

function zoomToCounty(g) {
  const f = countyG.selectAll("path").filter(d => d.properties.GEOID === g).datum();
  const [[x0, y0], [x1, y1]] = mpath.bounds(f);
  const k = Math.min(5, 0.15 / Math.max((x1 - x0) / W, (y1 - y0) / H));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  // keep the county in the part of the map the detail panel doesn't cover
  const box = msvg.node().getBoundingClientRect(), panel = Math.min(470, box.width);
  const visibleX = box.width > panel + 200 ? (box.width - panel) / 2 / box.width : 0.5;
  msvg.transition().duration(900).call(zoom.transform, d3.zoomIdentity.translate(W * visibleX - k * cx, H / 2 - k * cy).scale(k));
}

/* =============================== DETAIL =============================== */
let detailSeq = 0;
async function openCounty(g, fly = false) {
  if (state.view !== "state" || state.st !== g.slice(0, 2)) enterState(g.slice(0, 2));
  state.sel = g; paint(); pinG.selectAll("g").classed("on", d => d.r.GEOID === g);

const SQFT_PER_ACRE = 43560;

  $("#resetW").hidden = !wChanged;
  $("#minMw").value = state.minMw;
  $("#minMwV").textContent = state.minMw ? fmtMW(state.minMw) : "Any";
  $("#minMwV").classList.toggle("changed", state.minMw !== 0);
  $("#resetMin").hidden = state.minMw === 0;
  $("#resetC").hidden = state.cooling === CFG.default_cooling;
  $("#resetP").hidden = state.power === CFG.default_power;
  document.querySelectorAll("#powerSeg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.p === state.power));
  document.querySelectorAll("#coolSeg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.c === state.cooling));
  document.querySelectorAll("#layerSeg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.k === state.layer));
}
function enterApp() {
  spin && spin.stop();
  $("#app").classList.add("on"); $("#intro").classList.add("gone");
}

async function init() {
  try { CFG = await getJSON("/api/config"); }
  catch (e) { $("#introErr").hidden = false; $("#introErr").innerHTML = `Couldn’t reach the server. <a class="lnk" href="">Retry</a>`; $("#goBtn").disabled = true; return; }
  $("#regionSel").innerHTML = CFG.regions.map(r => `<option value="${r.id}" ${r.ready ? "" : "disabled"}>${r.label}</option>`).join("");
  const h = readHash();
  MIN_VIABLE = CFG.facility.min_viable_mw ?? MIN_VIABLE;
  state.cooling = h.c || CFG.default_cooling;
  state.power = h.p || CFG.default_power;
  state.w = h.w || DEF_W();
  state.minMw = h.min || 0;
  state.layer = h.map || "score";
  if (h.st) deepLink = h;
  $("#coolSeg").innerHTML = Object.entries(CFG.cooling).map(([k, c]) => `<button data-c="${k}" title="${c.label} · ${c.l_per_kwh} L/kWh">${coolName(k)}</button>`).join("");
  document.querySelectorAll("#coolSeg button").forEach(b => b.onclick = () => { state.cooling = b.dataset.c; markOverrides(); reload(); });
  for (const [k, id] of [["power", "wp"], ["water", "ww"], ["land", "wl"]])
    $("#" + id).oninput = e => { state.w[k] = +e.target.value; markOverrides(); reload(); };
  $("#minMw").oninput = e => { state.minMw = +e.target.value; paint(); reload(); };
  $("#resetW").onclick = () => { state.w = DEF_W(); markOverrides(); reload(); };
  $("#resetMin").onclick = () => { state.minMw = 0; paint(); reload(); };
  $("#resetC").onclick = () => { state.cooling = CFG.default_cooling; markOverrides(); reload(); };
  $("#powerSeg").innerHTML = Object.entries(CFG.pricing.power_sources).map(([k, c]) => `<button data-p="${k}" title="${c.usd_mwh == null ? "State industrial average rate" : "$" + c.usd_mwh + "/MWh, approximate, plus delivery"}">${c.label}</button>`).join("");
  document.querySelectorAll("#powerSeg button").forEach(b => b.onclick = () => { state.power = b.dataset.p; markOverrides(); reload(); });
  $("#resetP").onclick = () => { state.power = CFG.default_power; markOverrides(); reload(); };
  markOverrides();
  document.querySelectorAll("#layerSeg button").forEach(b => b.onclick = () => {
    state.layer = b.dataset.k; paint(); if (state.view === "country") renderTop();
  });
  document.querySelectorAll("#kvSeg button").forEach(b => b.onclick = () => {
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); applyKv();
  });
  $("#topList").addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("li[role=button]")) { e.preventDefault(); e.target.click(); }
  });
  $("#zin").onclick = () => msvg.transition().call(zoom.scaleBy, 1.6);
  $("#zout").onclick = () => msvg.transition().call(zoom.scaleBy, 1 / 1.6);
  $("#zreset").onclick = () => state.view === "state"
    ? fitTo(stFillG.selectAll("path").filter(d => d.id === state.st).datum())
    : msvg.transition().duration(700).call(zoom.transform, d3.zoomIdentity);
  $("#goBtn").onclick = zoomToRegion;
  $("#backBtn").onclick = backToGlobe;
  addEventListener("keydown", e => { if (e.key === "Escape") goUp(); });
  mapReady = initMap();
  renderCrumb();
  reload();
}
initGlobe();
init();
</script>
</body>
</html>
