<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time to Power</title>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/vendor/topojson-client.min.js"></script>
<style>
  :root {
    --bg: #0e0f10; --surface-1: #1a1a19; --surface-2: #232321; --line: #33332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --grid: #d95926;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; color: inherit; }

  /* ---------- intro / globe ---------- */
  #intro { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #15212f 0%, #0b0d10 55%, #060708 100%);
    transition: opacity .7s ease; z-index: 5; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #globe { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stars circle { fill: #fff; }
  .ocean { fill: #0f2236; }
  .land { fill: #2a4a6a; stroke: #4c76a0; stroke-width: .4; }
  .land.na { fill: #3987e5; }
  .graticule { fill: none; stroke: #ffffff14; stroke-width: .5; }
  .halo { fill: none; stroke: #3987e544; stroke-width: 18; filter: blur(14px); }
  #introCard { position: relative; z-index: 2; text-align: center; margin-top: 52vh;
    transition: opacity .4s ease, transform .4s ease; }
  #introCard.hide { opacity: 0; transform: translateY(12px); }
  h1 { margin: 0 0 10px; font-size: clamp(36px, 5.4vw, 64px); letter-spacing: -.035em; font-weight: 700; }
  .lede { color: var(--text-secondary); margin: 0 auto 28px; font-size: 19px; letter-spacing: -.01em; }
  .pick { display: inline-flex; gap: 10px; background: #00000066; padding: 8px; border-radius: 14px;
    border: 1px solid var(--line); backdrop-filter: blur(6px); }
  .pick select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 200px; }
  .btn { background: var(--accent); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }

  /* ---------- app ---------- */
  #app { position: fixed; inset: 0; display: grid; grid-template-columns: 300px 1fr; opacity: 0;
    transition: opacity .8s ease; }
  #app.on { opacity: 1; }
  aside { background: var(--surface-1); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 28px; }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .brand b { font-size: 17px; letter-spacing: -.01em; font-weight: 600; }
  .icon { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 8px; color: var(--text-secondary); }
  .sec { margin-top: 26px; }
  .sec h3 { margin: 0 0 10px; font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .seg { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { background: transparent; border: 0; padding: 7px 0; border-radius: 8px; cursor: pointer; color: var(--text-secondary); font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--text-primary); color: #111; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; color: var(--text-secondary); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .v { width: 44px; text-align: right; color: var(--text-primary); }
  select.full { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .legend .bar { height: 10px; border-radius: 5px; }
  .legend .ticks { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  ol.top { list-style: none; padding: 0; margin: 0; counter-reset: t; }
  ol.top li { counter-increment: t; display: grid; grid-template-columns: 20px 1fr auto auto; gap: 8px; align-items: baseline;
    padding: 7px 6px; border-radius: 8px; cursor: pointer; }
  ol.top li:hover { background: var(--surface-2); }
  ol.top li::before { content: counter(t); color: var(--text-muted); font-size: 12px; }
  ol.top .s { color: var(--text-muted); font-size: 12px; }

  main { position: relative; overflow: hidden; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; }
  #map:active { cursor: grabbing; }
  .county { stroke: var(--bg); stroke-width: .25; }
  .county.dim { fill: #262624 !important; }
  .county:hover { stroke: var(--text-primary); stroke-width: 1; }
  .county.sel { stroke: #fff; stroke-width: 1.6; }
  .stfill { stroke: var(--bg); stroke-width: .8; cursor: pointer; }
  .stfill:hover { stroke: var(--text-primary); stroke-width: 1.5; }
  .stfill.dim { fill: #262624 !important; }
  .stfill.ctx { fill: #1d1d1c !important; }
  .stfill.ctx:hover { fill: #2a2a28 !important; }
  .stfill.cur { fill: none !important; pointer-events: none; }
  .crumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .states { fill: none; stroke: #0e0f10; stroke-width: 1; stroke-linejoin: round; }
  .gridline { fill: none; stroke: var(--grid); stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .topbar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .crumb { background: #000a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--text-muted); backdrop-filter: blur(8px); }
  .crumb b { color: var(--text-primary); }
  .zoombtns { display: flex; flex-direction: column; gap: 6px; position: absolute; bottom: 18px; left: 16px; }
  .zoombtns button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-1); cursor: pointer; font-size: 16px; color: var(--text-secondary); }
  #tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; min-width: 180px; display: none; box-shadow: 0 8px 24px #0008; }
  #tip .t { font-weight: 600; margin-bottom: 4px; }
  #tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--text-secondary); }
  #tip .r b { color: var(--text-primary); font-weight: 600; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-muted); pointer-events: none; }

  /* ---------- detail ---------- */
  #detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(470px, 100%); background: var(--surface-1);
    border-left: 1px solid var(--line); transform: translateX(105%); transition: transform .35s ease; overflow-y: auto; padding: 20px 22px 40px; z-index: 3; }
  #detail.open { transform: none; box-shadow: -20px 0 40px #0007; }
  .close { position: sticky; top: 0; float: right; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; }
  #detail h2 { margin: 2px 0 0; font-size: 26px; letter-spacing: -.025em; font-weight: 700; }
  .sub { color: var(--text-muted); }
  .hero { margin: 28px 0 22px; }
  .hero .big { font-size: 56px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
  .hero .line { color: var(--text-secondary); margin-top: 8px; font-size: 15px; }
  .factors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .factor { background: var(--surface-2); border-radius: 12px; padding: 12px; border: 1px solid transparent; }
  .factor.bind { border-color: var(--warning); }
  .factor .k { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; }
  .factor.bind .k b { color: var(--warning); font-weight: 500; font-size: 11px; }
  .factor .m { font-size: 20px; font-weight: 600; margin-top: 4px; letter-spacing: -.01em; }
  .factor .s { color: var(--text-secondary); font-size: 12px; }
  .factor .flag { color: var(--warning); font-size: 11px; margin-top: 4px; }
  .meter { height: 6px; background: #ffffff14; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .card { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
  .card h4 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
  details.card summary { cursor: pointer; list-style: none; font-size: 13px; color: var(--text-muted); }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "+"; float: right; }
  details.card[open] summary::after { content: "−"; }
  details.card[open] summary { margin-bottom: 8px; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--text-secondary); vertical-align: top; }
  table.kv td:last-child { text-align: right; color: var(--text-primary); }
  table.kv tr:last-child td { border-bottom: 0; }
  .bars .b { display: grid; grid-template-columns: 130px 1fr 70px; gap: 8px; align-items: center; margin: 6px 0; color: var(--text-secondary); font-size: 13px; }
  .bars .b .track { height: 10px; background: #ffffff10; border-radius: 0 4px 4px 0; }
  .bars .b .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  .bars .b.cur .fill { background: #9ec5f4; }
  .bars .b span:last-child { text-align: right; color: var(--text-primary); }
  .note { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin-top: 16px; text-align: center; }
</style>
</head>
<body>

<!-- =============== INTRO: spinning globe =============== -->
<section id="intro">
  <svg id="globe" aria-label="Spinning globe"></svg>
  <div id="introCard">
    <h1>Where can AI get built?</h1>
    <p class="lede">Power, water and land. County by county.</p>
    <div class="pick">
      <select id="regionSel" aria-label="Region"></select>
      <button class="btn" id="goBtn">Explore</button>
    </div>
  </div>
</section>

<!-- =============== APP =============== -->
<div id="app">
  <aside>
    <div class="brand">
      <b>Time to Power</b>
      <button class="btn ghost icon" id="backBtn" title="Back to globe" aria-label="Back to globe">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="2.8" ry="6.5"/><path d="M1.5 8h13"/></svg>
      </button>
    </div>

    <div class="sec">
      <h3>Map</h3>
      <div class="seg" id="layerSeg">
        <button data-k="score" aria-pressed="true">Overall</button>
        <button data-k="power_score">Power</button>
        <button data-k="water_score">Water</button>
        <button data-k="land_score">Land</button>
      </div>
      <div class="legend" style="margin-top:12px">
        <div class="bar" id="legendBar"></div>
        <div class="ticks"><span>Low</span><span>High</span></div>
      </div>
    </div>

    <div class="sec">
      <h3>Priorities</h3>
      <div class="row">Power<input type="range" id="wp" min="0" max="100" /><span class="v num" id="wpV"></span></div>
      <div class="row">Water<input type="range" id="ww" min="0" max="100" /><span class="v num" id="wwV"></span></div>
      <div class="row">Land<input type="range" id="wl" min="0" max="100" /><span class="v num" id="wlV"></span></div>
    </div>

    <div class="sec">
      <h3>Minimum size</h3>
      <div class="row"><input type="range" id="minMw" min="0" max="1000" step="25" value="0" /><span class="v num" id="minMwV">Any</span></div>
    </div>

    <div class="sec">
      <h3>Cooling</h3>
      <div class="seg" id="coolSeg" style="--n:3"></div>
    </div>

    <div class="sec">
      <h3>Grid lines</h3>
      <div class="seg" id="kvSeg" style="--n:3">
        <button data-kv="500" aria-pressed="true">500 kV</button>
        <button data-kv="345" aria-pressed="true">345 kV</button>
        <button data-kv="230" aria-pressed="false">230 kV</button>
      </div>
    </div>

    <div class="sec">
      <h3 id="topTitle">Top states</h3>
      <ol class="top" id="topList"></ol>
    </div>
  </aside>

  <main>
    <svg id="map" aria-label="County heat map"></svg>
    <div class="loading" id="loading">Loading…</div>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
    </div>
    <div class="zoombtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view">⟲</button></div>
    <div id="tip"></div>
    <section id="detail" aria-live="polite"></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = d3.format(",.0f");
const fmtMW = v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + " GW" : fmt(v) + " MW";
const fmtMoney = v => v >= 1e9 ? "$" + (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : "$" + fmt(v);
const fmtTok = v => v >= 1e15 ? (v / 1e15).toFixed(1) + " quadrillion" : v >= 1e12 ? (v / 1e12).toFixed(1) + " trillion" : (v / 1e9).toFixed(1) + " billion";
const LAYER_NAME = { score: "Overall", power_score: "Power", water_score: "Water", land_score: "Land" };
const COOL_NAME = { evaporative: "Evaporative", hybrid: "Hybrid", closed_loop: "Dry" };
const coolName = k => COOL_NAME[k] || CFG.cooling[k].label.split(" (")[0];
// sequential blue ramp, dark surface: low recedes toward the surface, high is light
const RAMP = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#6da7ec", "#86b6ef", "#9ec5f4", "#b7d3f6", "#cde2fb"];
const color = d3.scaleQuantize([0, 100], RAMP);
$("#legendBar").style.background = `linear-gradient(90deg, ${RAMP.join(",")})`;

const state = { layer: "score", minMw: 0, cooling: null, w: {}, rows: new Map(), sel: null,
  view: "country", st: null, stAgg: new Map() };   // view: "country" (states) -> "state" (its counties)
const ABBR = new Map();  // state FIPS -> postal code, filled from the county rows
let CFG;

/* =============================== GLOBE =============================== */
const gsvg = d3.select("#globe");
let gW, gH, gR, proj, gpath, spin, rot = [20, -15, 0];
async function initGlobe() {
  const [land, countries] = await Promise.all([d3.json("/static/vendor/land-110m.json"), d3.json("/static/vendor/countries-110m.json")]);
  const landF = topojson.feature(land, land.objects.land);
  const ctry = topojson.feature(countries, countries.objects.countries).features;
  const NA = new Set(["840", "124", "484"]);  // USA, Canada, Mexico
  gW = 1600; gH = 900; gR = 250;  // fixed canvas, scaled to the window with preserveAspectRatio=slice
  proj = d3.geoOrthographic().scale(gR).translate([gW / 2, gH * 0.36]).rotate(rot).clipAngle(90);
  gpath = d3.geoPath(proj);
  gsvg.attr("viewBox", `0 0 ${gW} ${gH}`).attr("preserveAspectRatio", "xMidYMid slice");
  const stars = gsvg.append("g").attr("class", "stars");
  d3.range(160).forEach(() => stars.append("circle").attr("cx", Math.random() * gW).attr("cy", Math.random() * gH)
    .attr("r", Math.random() * 1.1 + .2).attr("opacity", Math.random() * .6 + .1));
  const g = gsvg.append("g");
  g.append("circle").attr("class", "halo");
  g.append("path").datum({ type: "Sphere" }).attr("class", "ocean");
  g.append("path").datum(d3.geoGraticule10()).attr("class", "graticule");
  g.append("path").datum(landF).attr("class", "land");
  g.selectAll(".ctry").data(ctry.filter(c => NA.has(c.id))).join("path").attr("class", "land na ctry").attr("opacity", 0);
  const draw = () => {
    g.select(".halo").attr("cx", proj.translate()[0]).attr("cy", proj.translate()[1]).attr("r", proj.scale());
    g.selectAll("path").attr("d", gpath);
  };
  draw();
  spin = d3.timer(el => { rot[0] = 20 + el * 0.012; proj.rotate(rot); draw(); });
  window.globeDraw = draw;
  window.globeG = g;
}

let zooming = false;
function zoomToRegion() {
  if (zooming) return;   // ignore a double click while the globe is flying
  zooming = true;
  spin && spin.stop();
  $("#introCard").classList.add("hide");
  const from = proj.rotate(), to = [98, -40, 0];
  const s0 = proj.scale(), s1 = gR * 3.4;
  const t0 = proj.translate(), t1 = [gW / 2, gH / 2];
  const ri = d3.interpolate(from, to), si = d3.interpolate(s0, s1), ti = d3.interpolate(t0, t1);
  globeG.selectAll(".ctry").transition().duration(900).attr("opacity", 1);
  d3.transition().duration(2200).ease(d3.easeCubicInOut).tween("zoom", () => t => {
    proj.rotate(ri(Math.min(1, t * 1.6))).scale(si(t)).translate(ti(t)); globeDraw();
  }).on("end", () => {
    $("#app").classList.add("on");
    $("#intro").classList.add("gone");
    zooming = false;
    mapIntro();
  });
}

function backToGlobe() {
  $("#intro").classList.remove("gone");
  $("#app").classList.remove("on");
  $("#introCard").classList.remove("hide");
  globeG.selectAll(".ctry").attr("opacity", 0);
  proj.scale(gR).translate([gW / 2, gH * 0.36]);
  rot = [20, -15, 0];
  spin = d3.timer(el => { rot[0] = 20 + el * 0.012; proj.rotate(rot); globeDraw(); });
}

/* =============================== MAP =============================== */
const W = 975, H = 610;
const msvg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
const zoomG = msvg.append("g");
const countyG = zoomG.append("g"), stFillG = zoomG.append("g"), stateG = zoomG.append("g"), gridG = zoomG.append("g");
const mproj = d3.geoAlbersUsa();
const mpath = d3.geoPath(mproj);
const zoom = d3.zoom().scaleExtent([1, 24]).translateExtent([[-W * 0.6, -H * 0.6], [W * 1.6, H * 1.6]])
  .on("zoom", e => {
    zoomG.attr("transform", e.transform);
    countyG.selectAll("path").attr("stroke-width", .25 / e.transform.k);
    stateG.select("path").attr("stroke-width", 1 / e.transform.k);
    stFillG.selectAll("path").attr("stroke-width", .8 / e.transform.k);
    gridG.selectAll("path").attr("stroke-width", d => kvWidth(d.properties.kv) / Math.sqrt(e.transform.k));
  });
msvg.call(zoom);
const kvWidth = kv => kv >= 500 ? 1.6 : kv >= 345 ? 1.0 : .5;
let mapReady;

async function initMap() {
  const [counties, us, grid] = await Promise.all([
    d3.json("/static/data/counties.geojson"), d3.json("/static/vendor/counties-10m.json"), d3.json("/static/data/grid.json")]);
  mproj.fitExtent([[10, 40], [W - 10, H - 10]], { type: "FeatureCollection", features: counties.features.filter(f => f.properties.GEOID.slice(0, 2) !== "02" && f.properties.GEOID.slice(0, 2) !== "15") });
  // albersUsa insets AK/HI; fit on CONUS then re-fit including insets
  mproj.fitExtent([[10, 50], [W - 10, H - 10]], counties);
  countyG.selectAll("path").data(counties.features).join("path")
    .attr("class", "county").attr("d", mpath)
    .attr("fill", "#262624")
    .on("mousemove", showTip).on("mouseleave", () => $("#tip").style.display = "none")
    .on("click", (e, d) => openCounty(d.properties.GEOID));
  stFillG.selectAll("path").data(topojson.feature(us, us.objects.states).features).join("path")
    .attr("class", "stfill").attr("d", mpath).attr("fill", "#262624")
    .on("mousemove", showStateTip).on("mouseleave", () => $("#tip").style.display = "none")
    .on("click", (e, d) => enterState(d.id));
  stateG.append("path").datum(topojson.mesh(us, us.objects.states, (a, b) => a !== b)).attr("class", "states").attr("d", mpath);
  countyG.attr("display", "none");
  STATE_NAMES = new Map(topojson.feature(us, us.objects.states).features.map(f => [f.id, f.properties.name]));
  gridG.selectAll("path").data(grid.features).join("path").attr("class", "gridline").attr("d", mpath)
    .attr("stroke-width", d => kvWidth(d.properties.kv)).attr("stroke-opacity", d => d.properties.kv >= 345 ? .9 : .55);
  applyKv();
  $("#loading").remove();
}

function mapIntro() {
  // land on the map with a short zoom-out, continuing the globe's motion
  msvg.call(zoom.transform, d3.zoomIdentity.translate(-W * .35, -H * .4).scale(1.7));
  msvg.transition().delay(150).duration(1300).ease(d3.easeCubicOut).call(zoom.transform, d3.zoomIdentity);
}

function applyKv() {
  const on = new Set([...document.querySelectorAll("#kvSeg button[aria-pressed=true]")].map(b => +b.dataset.kv));
  gridG.selectAll("path").attr("display", d => on.has(d.properties.kv) ? null : "none");
}

// State value = mean score of its best quarter of counties (where you'd actually build),
// then ranked 0-100 among the states so the country view has full contrast.
function aggregateStates() {
  const by = d3.group([...state.rows.values()], r => r.GEOID.slice(0, 2));
  const raw = [];
  for (const [fips, rs] of by) {
    ABBR.set(fips, rs[0].STUSPS);
    const vals = rs.map(r => r[state.layer]).sort((a, b) => b - a);
    const q = vals.slice(0, Math.max(1, Math.ceil(vals.length / 4)));
    const best = rs.reduce((a, b) => (b.score > a.score ? b : a));
    const minHost = Math.max(state.minMw, 250);
    raw.push({ fips, v: d3.mean(q), n: rs.length, best, minHost,
      nHost: rs.filter(r => r.supportable_mw >= minHost).length,
      nOk: rs.filter(r => r.supportable_mw >= state.minMw).length });
  }
  // rank among states (0 = weakest, 100 = strongest) so colors spread evenly
  const order = raw.map(d => d.v).sort((a, b) => a - b);
  const rank = v => (d3.bisectLeft(order, v) / Math.max(1, order.length - 1)) * 100;
  state.stAgg = new Map(raw.map(d => [d.fips, { ...d, rank: rank(d.v) }]));
}

function paint() {
  aggregateStates();
  const country = state.view === "country";
  stFillG.selectAll("path")
    .attr("fill", d => { const a = state.stAgg.get(d.id); return a ? color(a.rank) : "#262624"; })
    .classed("dim", d => { const a = state.stAgg.get(d.id); return country && (!a || a.nOk === 0); })
    .classed("ctx", d => !country && d.id !== state.st)
    .classed("cur", d => !country && d.id === state.st);
  if (country) return;
  countyG.selectAll("path")
    .attr("fill", d => { const r = state.rows.get(d.properties.GEOID); return r ? color(r[state.layer]) : "#262624"; })
    .classed("dim", d => { const r = state.rows.get(d.properties.GEOID); return !r || r.supportable_mw < state.minMw; })
    .classed("sel", d => d.properties.GEOID === state.sel);
}

function q() {
  const p = new URLSearchParams({ cooling: state.cooling, wp: state.w.power, ww: state.w.water, wl: state.w.land });
  return p.toString();
}

let reloadT;
async function reload() {
  clearTimeout(reloadT);
  reloadT = setTimeout(async () => {
    const rows = await fetch("/api/map?" + q()).then(r => r.json());
    state.rows = new Map(rows.map(r => [r.GEOID, r]));
    await mapReady;
    paint();
    await renderTop();
    if (state.sel && $("#detail").classList.contains("open")) openCounty(state.sel);
  }, 120);
}

async function renderTop() {
  if (state.view === "country") {
    $("#topTitle").textContent = "Top states";
    const top = [...state.stAgg.values()].filter(a => a.nOk > 0).sort((a, b) => b.v - a.v).slice(0, 10);
    $("#topList").innerHTML = top.map(a => `<li data-s="${a.fips}"><span>${stateName(a.fips)}</span><span class="s num">${fmtMW(a.best.supportable_mw)}</span><b class="num">${a.v.toFixed(0)}</b></li>`).join("");
    document.querySelectorAll("#topList li").forEach(li => li.onclick = () => enterState(li.dataset.s));
  } else {
    const fips = state.st;
    $("#topTitle").textContent = `Top in ${stateName(fips)}`;
    const top = await fetch(`/api/top?n=10&min_mw=${state.minMw}&state=${ABBR.get(fips)}&` + q()).then(r => r.json());
    if (state.st !== fips) return;
    $("#topList").innerHTML = top.length
      ? top.map(t => `<li data-g="${t.GEOID}"><span>${t.NAME}</span><span class="s num">${fmtMW(t.supportable_mw)}</span><b class="num">${t.score.toFixed(0)}</b></li>`).join("")
      : `<li style="cursor:default"><span></span><span class="s">None at ${fmtMW(state.minMw)}</span></li>`;
    document.querySelectorAll("#topList li[data-g]").forEach(li => li.onclick = () => openCounty(li.dataset.g, true));
  }
}

let STATE_NAMES = new Map();
const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
const stateName = f => STATE_NAMES.get(f) || ABBR.get(f) || f;

function renderCrumb() {
  $("#crumb").innerHTML = state.view === "country"
    ? `<b>United States</b>`
    : `<a id="cUS">United States</a> › <b>${stateName(state.st)}</b>`;
  if ($("#cUS")) $("#cUS").onclick = toCountry;
}

function fitTo(feature, pad = 0.85, dur = 900) {
  const [[x0, y0], [x1, y1]] = mpath.bounds(feature);
  const k = Math.min(12, pad / Math.max((x1 - x0) / W, (y1 - y0) / H));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  msvg.transition().duration(dur).ease(d3.easeCubicInOut)
    .call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * cx, H / 2 - k * cy).scale(k));
}

function enterState(fips) {
  if (!state.stAgg.has(fips)) return;
  $("#tip").style.display = "none";
  if (state.sel) closeDetail();
  state.view = "state"; state.st = fips;
  countyG.attr("display", null);
  countyG.selectAll("path").attr("display", d => d.properties.GEOID.slice(0, 2) === fips ? null : "none");
  paint(); renderCrumb(); renderTop();
  fitTo(stFillG.selectAll("path").filter(d => d.id === fips).datum());
}

function toCountry() {
  $("#tip").style.display = "none";
  if (state.sel) closeDetail();
  state.view = "country"; state.st = null;
  countyG.attr("display", "none");
  paint(); renderCrumb(); renderTop();
  msvg.transition().duration(800).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity);
}

function showStateTip(e, d) {
  if (state.view === "state" && d.id === state.st) return;
  const a = state.stAgg.get(d.id); if (!a) return;
  placeTip(e, `<div class="t">${stateName(d.id)}</div>
    <div class="r">${LAYER_NAME[state.layer]}<b class="num">${a.v.toFixed(0)}</b></div>
    <div class="r">Best<b>${a.best.NAME} · ${fmtMW(a.best.supportable_mw)}</b></div>`);
}

function placeTip(e, html) {
  const tip = $("#tip"), box = $("main").getBoundingClientRect();
  tip.innerHTML = html;
  tip.style.display = "block";
  let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
  if (x + 260 > box.width) x -= 280;
  if (y + 170 > box.height) y -= 180;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

function showTip(e, d) {
  const r = state.rows.get(d.properties.GEOID); if (!r) return;
  placeTip(e, `<div class="t">${r.NAME}, ${r.STUSPS}</div>
    <div class="r">${LAYER_NAME[state.layer]}<b class="num">${r[state.layer].toFixed(0)}</b></div>
    <div class="r">Capacity<b class="num">${fmtMW(r.supportable_mw)}</b></div>
    <div class="r">Limit<b>${cap(r.binding)}</b></div>`);
}

function zoomToCounty(g) {
  const f = countyG.selectAll("path").filter(d => d.properties.GEOID === g).datum();
  const [[x0, y0], [x1, y1]] = mpath.bounds(f);
  const k = Math.min(5, 0.15 / Math.max((x1 - x0) / W, (y1 - y0) / H));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  // keep the county in the part of the map the detail panel doesn't cover
  const box = msvg.node().getBoundingClientRect(), panel = Math.min(470, box.width);
  const visibleX = box.width > panel + 200 ? (box.width - panel) / 2 / box.width : 0.5;
  msvg.transition().duration(900).call(zoom.transform, d3.zoomIdentity.translate(W * visibleX - k * cx, H / 2 - k * cy).scale(k));
}

/* =============================== DETAIL =============================== */
async function openCounty(g, fly = false) {
  if (state.view !== "state" || state.st !== g.slice(0, 2)) enterState(g.slice(0, 2));
  state.sel = g; paint();
  if (fly) zoomToCounty(g);
  const r = await fetch(`/api/county/${g}?` + q()).then(x => x.json());
  const t = r.tokens, maxCool = Math.max(...Object.values(r.all_cooling), 1);
  const factor = (k, label, mw, score) => `
    <div class="factor ${r.binding === k ? "bind" : ""}">
      <div class="k">${label}${r.binding === k ? "<b>Limit</b>" : ""}</div><div class="m num">${fmtMW(mw)}</div>
      <div class="meter"><i style="width:${score}%"></i></div>
    </div>`;
  const mix = (r.planned_mix || []).map(([tech, mw]) => `${tech} ${fmt(mw)} MW`).join("<br>") || "None";
  const county = `${r.NAME}${/County|Parish|Borough|city/i.test(r.NAME) ? "" : " County"}`;
  $("#detail").innerHTML = `
    <button class="close" aria-label="Close" onclick="closeDetail()">✕</button>
    <div class="sub num">${r.STATE_NAME} · #${fmt(r.rank)} of ${fmt(r.of)}</div>
    <h2>${county}</h2>

    <div class="hero">
      <div class="big num">${fmtMW(r.supportable_mw)}</div>
      <div class="line">${cap(r.binding)}-limited · Power in ${r.months_lo}–${r.months_hi} months</div>
    </div>

    <div class="factors">
      ${factor("power", "Power", r.power_mw, r.power_score)}
      ${factor("water", "Water", r.water_mw, r.water_score)}
      ${factor("land", "Land", r.land_mw, r.land_score)}
    </div>

    <div class="card">
      <h4>Tokens per day</h4>
      <table class="kv">${["small", "medium", "large"].map(k => `<tr><td title="${t[k].examples}">${t[k].label.replace(" model", "")}</td><td class="num">${fmtTok(t[k].typical)}</td></tr>`).join("")}</table>
    </div>

    <div class="card">
      <h4>Cost per year</h4>
      <table class="kv">
        <tr><td>Electricity</td><td class="num">${fmtMoney(r.elec_cost_year)}</td></tr>
        <tr><td>Water</td><td class="num">${fmtMoney(r.water_cost_year)}</td></tr>
      </table>
    </div>

    <div class="card">
      <h4>Water limit by cooling</h4>
      <div class="bars">${Object.entries(r.all_cooling).map(([c, mw]) => `<div class="b ${c === r.cooling ? "cur" : ""}"><span>${coolName(c)}</span><div class="track"><div class="fill" style="width:${Math.max(2, mw / maxCool * 100)}%"></div></div><span class="num">${fmtMW(mw)}</span></div>`).join("")}</div>
    </div>

    <details class="card">
      <summary>Details</summary>
      <table class="kv">
        <tr><td>Grid operator</td><td>${r.ba || "n/a"}</td></tr>
        <tr><td>Highest line</td><td class="num">${r.max_kv ? r.max_kv + " kV" : "Under 230 kV"}</td></tr>
        <tr><td>Lines 500 / 345 / 230 kV</td><td class="num">${fmt(r.km_500)} / ${fmt(r.km_345)} / ${fmt(r.km_230)} km</td></tr>
        <tr><td>Generation today</td><td class="num">${fmtMW(r.gen_mw)}</td></tr>
        <tr><td>Planned by 2029</td><td class="num">${fmtMW(r.planned_mw)}</td></tr>
        <tr><td>Planned mix</td><td>${mix}</td></tr>
        <tr><td>Retiring by 2030</td><td class="num">${fmtMW(r.retire_mw)}</td></tr>
        <tr><td>Public water supply</td><td class="num">${r.ps_mgd.toFixed(1)} Mgal/day${r.water_est ? " (est.)" : ""}</td></tr>
        <tr><td>Water stress</td><td class="num">${r.water_stress.toFixed(0)} / 100</td></tr>
        <tr><td>Open land</td><td class="num">${fmt(r.open_acres)} acres</td></tr>
        <tr><td>Population</td><td class="num">${fmt(r.pop)}</td></tr>
        <tr><td>Electricity rate</td><td class="num">${r.elec_ind_c ? r.elec_ind_c.toFixed(2) + "¢/kWh" : "n/a"}</td></tr>
        <tr><td>Water rate</td><td class="num">$${r.water_price.toFixed(2)} / 1,000 gal</td></tr>
        <tr><td>Load</td><td class="num">${Math.round(r.utilization * 100)}%</td></tr>
      </table>
    </details>
    <div class="note">Screening estimate. Not an interconnection study.</div>`;
  $("#detail").classList.add("open");
}
function closeDetail() { $("#detail").classList.remove("open"); state.sel = null; paint(); }
function goUp() {  // Esc: close the panel first, then step back up a level
  if ($("#detail").classList.contains("open")) closeDetail();
  else if (state.view === "state") toCountry();
}

/* =============================== WIRING =============================== */
async function init() {
  CFG = await fetch("/api/config").then(r => r.json());
  $("#regionSel").innerHTML = CFG.regions.map(r => `<option value="${r.id}" ${r.ready ? "" : "disabled"}>${r.label}</option>`).join("");
  state.cooling = CFG.default_cooling;
  $("#coolSeg").innerHTML = Object.entries(CFG.cooling).map(([k, c]) => `<button data-c="${k}" title="${c.label} · ${c.l_per_kwh} L/kWh" aria-pressed="${k === state.cooling}">${coolName(k)}</button>`).join("");
  document.querySelectorAll("#coolSeg button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#coolSeg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    state.cooling = b.dataset.c; reload();
  });
  for (const [k, id] of [["power", "wp"], ["water", "ww"], ["land", "wl"]]) {
    state.w[k] = Math.round(CFG.weights[k] * 100);
    const el = $("#" + id); el.value = state.w[k]; $("#" + id + "V").textContent = state.w[k];
    el.oninput = () => { state.w[k] = +el.value; $("#" + id + "V").textContent = el.value; reload(); };
  }
  $("#minMw").oninput = e => { state.minMw = +e.target.value; $("#minMwV").textContent = state.minMw ? fmtMW(state.minMw) : "Any"; paint(); reload(); };
  document.querySelectorAll("#layerSeg button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#layerSeg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    state.layer = b.dataset.k; paint(); if (state.view === "country") renderTop();
  });
  document.querySelectorAll("#kvSeg button").forEach(b => b.onclick = () => {
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); applyKv();
  });
  $("#zin").onclick = () => msvg.transition().call(zoom.scaleBy, 1.6);
  $("#zout").onclick = () => msvg.transition().call(zoom.scaleBy, 1 / 1.6);
  $("#zreset").onclick = () => state.view === "state"
    ? fitTo(stFillG.selectAll("path").filter(d => d.id === state.st).datum())
    : msvg.transition().duration(700).call(zoom.transform, d3.zoomIdentity);
  $("#goBtn").onclick = zoomToRegion;
  $("#backBtn").onclick = backToGlobe;
  addEventListener("keydown", e => { if (e.key === "Escape") goUp(); });
  mapReady = initMap();
  renderCrumb();
  reload();
}
initGlobe();
init();
</script>
